<!-- @dsCard group="Records" height=140 subtitle="Labels that can stack, never traffic lights" -->
<div class="as-root" style="padding:24px;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start">
  <span class="as-finding"><span class="as-finding__glyph" aria-hidden="true">●</span>Origin established</span>
  <span class="as-finding"><span class="as-finding__glyph" aria-hidden="true">◐</span>Within period</span>
  <span class="as-finding as-finding--expired"><span class="as-finding__glyph" aria-hidden="true">⏱</span>Expired</span>
  <span class="as-finding as-finding--expired"><span class="as-finding__glyph" aria-hidden="true">↺</span>Withdrawn</span>
  <span class="as-finding as-finding--conflict"><span class="as-finding__glyph" aria-hidden="true">▲</span>Evidence conflicts</span>
  <span class="as-finding as-finding--unanswered"><span class="as-finding__glyph" aria-hidden="true">○</span>Unanswered</span>
</div>
